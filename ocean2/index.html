<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Cala Blanca — Ocean Diorama 2.0</title>
<style>:root{--ink:#f4f7fb;--glass:#0a1c308c;--line:#ffffff38;--acc:#3fd0c9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;background:#06213f;margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}#app canvas{width:100vw;height:100vh;display:block}.brand{left:max(18px,env(safe-area-inset-left));letter-spacing:.06em;opacity:.92;text-shadow:0 1px 6px #00000059;font:600 13px/1 Georgia,Noto Serif,serif;position:fixed;top:14px}.brand small{letter-spacing:.18em;opacity:.75;text-transform:uppercase;margin-left:10px;font:500 10px system-ui}#tuneBtn{right:max(14px,env(safe-area-inset-right));border:1px solid var(--line);background:var(--glass);min-width:72px;height:44px;color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:22px;font:600 14px system-ui;position:fixed;top:10px}.hero{left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none;max-width:calc(100vw - 36px);position:fixed}.eyebrow{letter-spacing:.24em;text-transform:uppercase;opacity:.85;font:600 10px system-ui}h1{letter-spacing:-.01em;text-shadow:0 2px 18px #00143259;margin:4px 0 2px;font:400 clamp(38px,7vw,64px)/1 Georgia,Noto Serif,DejaVu Serif,serif}.sub{opacity:.9;margin-bottom:10px;font:italic 14px Georgia,Noto Serif,serif}.pills{pointer-events:auto;flex-wrap:wrap;gap:8px;max-width:min(92vw,620px);display:flex}.pill,.seg button,.wbtn{border:1px solid var(--line);background:var(--glass);min-height:40px;color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:20px;padding:0 16px;font:600 13px system-ui}.pill.on,.seg button.on,.wbtn.on{color:#0a2440;background:#f4f7fb;border-color:#fff}.seg{right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:24px;gap:4px;padding:4px;display:flex;position:fixed}.seg button{background:0 0;border:none;min-width:64px}#caption{background:var(--glass);border:1px solid var(--line);text-align:center;opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:18px;max-width:min(80vw,520px);padding:10px 16px;font:500 13px system-ui;transition:all .35s;position:fixed;top:16px;left:50%;transform:translate(-50%,-8px)}#caption.show{opacity:1;transform:translate(-50%)}#panel{top:64px;right:max(12px,env(safe-area-inset-right));border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);touch-action:pan-y;background:#081a2cdb;border-radius:18px;width:min(330px,100vw - 24px);padding:16px 18px;transition:transform .35s;position:fixed;bottom:76px;overflow:auto;transform:translate(120%)}#panel.open{transform:none}#panel h2{justify-content:space-between;align-items:center;margin:0 0 10px;font:400 22px Georgia,Noto Serif,serif;display:flex}#closePanel{border:1px solid var(--line);width:40px;height:40px;color:var(--ink);background:0 0;border-radius:20px;font-size:18px}#panel h3{letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:14px 0 6px;font:700 11px system-ui}.row{margin:8px 0}.row label{opacity:.9;justify-content:space-between;font:500 12px system-ui;display:flex}input[type=range]{width:100%;height:32px;accent-color:var(--acc)}select{width:100%;height:40px;color:var(--ink);border:1px solid var(--line);background:#0d2f4e;border-radius:10px;padding:0 10px;font:500 14px system-ui}.wrow{flex-wrap:wrap;gap:6px;display:flex}@media (aspect-ratio<=9/10){.seg{top:62px;bottom:auto}#panel{top:112px;bottom:190px}}@media (height<=420px){h1{font-size:34px}.sub{display:none}.pill{min-height:36px;padding:0 12px}}body.wall>:not(#app){display:none!important}</style>  <script type="module" crossorigin src="./assets/index-CdH1KgVk.js"></script>
</head><body>
<div id="app"></div>
<div class="brand">Ocean Diorama<small>v2.0 · open water</small></div>
<button id="tuneBtn">Tune ⚙</button>
<div id="caption"></div>
<div class="hero"><div class="eyebrow">Open water · an island</div><h1>Cala Blanca.</h1><div class="sub">A little world, far from everywhere.</div>
<div class="pills"><button class="pill on" data-view="island">The island</button><button class="pill" data-view="house">The house</button><button class="pill" data-view="palm">The palm</button><button class="pill" data-view="moorings">The moorings</button><button class="pill" data-view="sea">The sea</button></div></div>
<div class="seg"><button data-tod="day" class="on">Day</button><button data-tod="sunset">Sunset</button><button data-tod="night">Night</button></div>
<div id="panel"><h2>Make a little weather.<button id="closePanel">✕</button></h2>
<div class="wrow"><button class="wbtn on" data-weather="pristine">Pristine</button><button class="wbtn" data-weather="breezy">Breezy</button><button class="wbtn" data-weather="stormy">Stormy</button></div>
<h3>Water</h3>
<div class="row"><label>Water colour</label><select id="tint"><option value="caribbean">Caribbean turquoise</option><option value="atlantic">Deep Atlantic</option><option value="emerald">Emerald cove</option></select></div>
<div class="row"><label>Wave height<span class="val"></span></label><input type="range" data-k="wave" min="0" max="3" step="0.05"></div>
<div class="row"><label>Clarity<span class="val"></span></label><input type="range" data-k="clarity" min="0" max="1" step="0.01"></div>
<div class="row"><label>Foam<span class="val"></span></label><input type="range" data-k="foam" min="0" max="1" step="0.01"></div>
<h3>Sun &amp; sky</h3>
<div class="row"><label>Time of day (day → sunset → night)<span class="val"></span></label><input type="range" data-k="tod" min="0" max="2" step="0.01"></div>
<div class="row"><label>Sun angle<span class="val"></span></label><input type="range" data-k="sunAngle" min="-30" max="30" step="1"></div>
<div class="row"><label>Sun intensity<span class="val"></span></label><input type="range" data-k="sunI" min="0.2" max="1.6" step="0.01"></div>
<div class="row"><label>Cloud cover<span class="val"></span></label><input type="range" data-k="cloud" min="0" max="1" step="0.01"></div>
<div class="row"><label>Haze<span class="val"></span></label><input type="range" data-k="haze" min="0" max="1" step="0.01"></div>
<h3>Quality</h3>
<div class="row"><select id="quality"><option value="low">Low — battery saver</option><option value="medium">Medium</option><option value="high">High — sharpest</option></select></div>
</div></body></html>
